name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web i online učionica
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: eldi-ci-only-password
          MYSQL_DATABASE: eldi3333qa
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -peldi-ci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Pripremi PHP i biblioteke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Provjeri PHP i stvarni MySQL rad
        run: |
          for file in website/eldi-edu/online/*.php; do php -l "$file"; done
          python3 tests/online3333.py
      - name: Provjeri web radionicu i offline rad
        run: |
          npm run editor:bundle
          npm run studio33:bundle
          node --test tests/edition3333.test.cjs tests/studio33.test.cjs
          node scripts/build-browser33.cjs
          node tests/edition3333-web.cjs
      - name: Sačuvaj stvarne web prikaze
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ELDI-EDU-33.33.0-Web-QA
          path: smoke-previews/web3333/
          if-no-files-found: warn
  windows:
    needs: web
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Preuzmi izvorni kod
        uses: actions/checkout@v7
      - name: Preuzmi provjerene web prikaze
        uses: actions/download-artifact@v7
        with:
          name: ELDI-EDU-33.33.0-Web-QA
          path: smoke-previews/web3333
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: GCC i G++ (MSYS2 UCRT64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          cache: false
      - name: Instaliraj zavisnosti
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ugradi službeni Scratch editor i offline biblioteku
        run: npm run scratch:bundle
      - name: Provjeri kod, sadržaj i integracije
        run: npm run check
      - name: Provjeri početno učitavanje iz ASAR paketa
        shell: pwsh
        run: |
          npx electron-builder --config scripts/startup-audit.config.cjs --win --x64 --dir --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path 'smoke-previews' | Out-Null
          $auditApplication = Join-Path $PWD 'release-startup-audit/win-unpacked/ELDI EDU.exe'
          $auditProcess = Start-Process -FilePath $auditApplication -ArgumentList '--startup-test' -WorkingDirectory $PWD -PassThru -Wait -RedirectStandardOutput 'smoke-previews/startup-stdout.log' -RedirectStandardError 'smoke-previews/startup-stderr.log'
          Get-Content 'smoke-previews/startup-stdout.log','smoke-previews/startup-stderr.log'
          if ($auditProcess.ExitCode -ne 0) { throw 'Početno učitavanje ASAR paketa nije uspjelo.' }
      - name: Ugradi Python, GCC/G++ i JDK
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: npm run runtime:bundle
      - name: Ugradi ChatGPT prijavu bez API ključa
        run: npm run chatgpt:bundle
      - name: Provjeri 324 programa iz zbirke na Windowsu
        shell: pwsh
        run: |
          $bookPython = Join-Path $PWD 'runtimes/python/python.exe'
          $bookCpp = Join-Path $PWD 'runtimes/gcc/bin/g++.exe'
          $env:Path = (Split-Path $bookCpp) + ';' + $env:Path
          $env:ELDI_BOOK_CPP_FLAGS = node -e 'const path=require("node:path");console.log(JSON.stringify(require("./desktop/runner.cjs").bundledGccOptions(path.resolve("runtimes"),"cpp")))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bookPython scripts/verify-book-programming.py --python $bookPython --cpp $bookCpp --jobs 4 --output smoke-previews/programming-verification-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provjeri 55 programerskih izazova kroz 880 izvršavanja
        run: node scripts/verify-program-assessments.cjs --bundled --output smoke-previews/assessment-verification-windows.json
      - name: Provjeri sva četiri ugrađena jezika
        run: node scripts/check.cjs --bundled
      - name: Provjeri desktop tokove i Scratch izvršavanje
        run: npm run smoke
      - name: Sačuvaj razvojne prikaze za pregled
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ELDI-EDU-33.33.0-Development-QA
          path: smoke-previews/
          if-no-files-found: warn
          retention-days: 30
      - name: Izradi instalacijski i prenosivi EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          for ($buildAttempt = 1; $buildAttempt -le 3; $buildAttempt++) {
            & npm run build:win 2>&1 | Tee-Object -Variable buildOutput
            $buildExit = $LASTEXITCODE
            if ($buildExit -eq 0) { exit 0 }
            $transientDownload = ($buildOutput -join "`n") -match 'Response code 5\d\d|ECONNRESET|ETIMEDOUT|EAI_AGAIN|socket hang up'
            if (-not $transientDownload -or $buildAttempt -eq 3) { exit $buildExit }
            Write-Warning "Privremena greška preuzimanja alata; ponavljanje izrade ($buildAttempt/3)."
            Start-Sleep -Seconds 15
          }
      - name: Provjeri zapakovanu aplikaciju i pripremi ZIP pakete
        shell: pwsh
        run: |
          $application = Join-Path $PWD 'release/win-unpacked/ELDI EDU.exe'
          $process = Start-Process -FilePath $application -ArgumentList '--smoke-test' -WorkingDirectory $PWD -PassThru -Wait -RedirectStandardOutput 'smoke-previews/packaged-stdout.log' -RedirectStandardError 'smoke-previews/packaged-stderr.log'
          Get-Content 'smoke-previews/packaged-stdout.log','smoke-previews/packaged-stderr.log'
          if ($process.ExitCode -ne 0) { throw 'Zapakovana aplikacija nije prošla provjeru pokretanja.' }
          $executables = Get-ChildItem release -Filter '*.exe'
          if ($executables.Count -ne 2) { throw 'Očekivana su dva EXE fajla.' }
          Get-ChildItem content/packs -Filter 'ELDI-EDU-33.33.0-*.zip' | Copy-Item -Destination release/
          Copy-Item 'smoke-previews/web3333/33.33-*.png' 'website/eldi-edu/assets/'
          Copy-Item 'smoke-previews/web3333/33.33-*.png' 'release/'
          node scripts/build-web-package.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packs = Get-ChildItem release -Filter '*.zip'
          if ($packs.Count -lt 7) { throw 'Nedostaju ZIP zbirke, Blockly, programerski izazovi, Scratch primjeri ili izvori.' }
          Copy-Item 'docs/POKRETANJE.txt' 'release/POKRETANJE.txt'
          $portable = Get-ChildItem release -Filter '*Portable-x64.exe'
          if ($portable.Count -ne 1) { throw 'Nedostaje prenosiva aplikacija za kompletan paket.' }
          $fullPath = Join-Path $PWD 'release/ELDI-EDU-33.33.0-Kompletan-paket.zip'
          $fullFiles = @($portable.FullName) + @($packs.FullName) + @((Join-Path $PWD 'release/POKRETANJE.txt'))
          Compress-Archive -LiteralPath $fullFiles -DestinationPath $fullPath -CompressionLevel NoCompression -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $fullArchive = [System.IO.Compression.ZipFile]::OpenRead($fullPath)
          try { if ($fullArchive.Entries.Count -ne $fullFiles.Count) { throw 'Kompletan paket nema sve datoteke.' } } finally { $fullArchive.Dispose() }
          $packs = Get-ChildItem release -Filter '*.zip'
          @($executables) + @($packs) | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content release/SHA256SUMS.txt
      - name: Sačuvaj provjere izgleda i PDF diplomu
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ELDI-EDU-33.33.0-Visual-QA
          path: smoke-previews/
          if-no-files-found: warn
          retention-days: 30
      - name: Sačuvaj Windows EXE i ZIP pakete
        uses: actions/upload-artifact@v7
        with:
          name: ELDI-EDU-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/33.33-*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Objavi izdanje na GitHubu
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v33.33.0' }}
          target_commitish: ${{ github.sha }}
          name: ELDI EDU 33.33 — Uči, vježbaj, takmiči se i stvaraj
          body_path: docs/RELEASE-33.33.md
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/33.33-*.png
          fail_on_unmatched_files: true
          make_latest: true
