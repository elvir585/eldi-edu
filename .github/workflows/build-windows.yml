name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Preuzmi izvorni kod
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: GCC i G++ (MSYS2 UCRT64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          cache: false

      - name: Instaliraj zavisnosti
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Provjeri kod
        run: npm run check

      - name: Ugradi Python, GCC/G++ i JDK
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: npm run runtime:bundle

      - name: Provjeri svih 324 rješenja programerske zbirke na Windowsu
        shell: pwsh
        run: |
          $bookPython = Join-Path $PWD 'runtimes/python/python.exe'
          $bookCpp = Join-Path $PWD 'runtimes/gcc/bin/g++.exe'
          $env:Path = (Split-Path $bookCpp) + ';' + $env:Path
          $env:ELDI_BOOK_CPP_FLAGS = node -e 'const path=require("node:path");console.log(JSON.stringify(require("./desktop/runner.cjs").bundledGccOptions(path.resolve("runtimes"),"cpp")))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bookPython scripts/verify-book-programming.py --python $bookPython --cpp $bookCpp --jobs 4 --output smoke-previews/programming-verification-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Provjeri sva četiri ugrađena jezika
        run: node scripts/check.cjs --bundled

      - name: Provjeri desktop prozor
        run: npm run smoke

      - name: Izradi instalacijski i prenosivi EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Provjeri zapakovanu aplikaciju
        shell: pwsh
        run: |
          $application = Join-Path $PWD 'release/win-unpacked/ELDI EDU.exe'
          $process = Start-Process -FilePath $application -ArgumentList '--smoke-test' -WorkingDirectory $PWD -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Zapakovana aplikacija nije prošla provjeru pokretanja.' }
          $executables = Get-ChildItem release -Filter '*.exe'
          if ($executables.Count -ne 2) { throw 'Očekivana su dva EXE fajla.' }
          Copy-Item 'content/packs/ELDI-EDU-10.5.0-Zbirke-i-rjesenja.zip' 'release/'
          Copy-Item 'content/packs/ELDI-EDU-10.5.0-1000-Blokovskih-projekata.zip' 'release/'
          $packs = Get-ChildItem release -Filter '*.zip'
          if ($packs.Count -ne 2) { throw 'Očekivana su dva ZIP paketa: zbirke i 1000 blokovskih projekata.' }
          @($executables) + @($packs) | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content release/SHA256SUMS.txt

      - name: Sačuvaj provjere izgleda i PDF diplomu
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ELDI-EDU-10.5.0-Visual-QA
          path: smoke-previews/
          if-no-files-found: warn
          retention-days: 30

      - name: Sačuvaj Windows EXE i ZIP zbirki
        uses: actions/upload-artifact@v7
        with:
          name: ELDI-EDU-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Objavi izdanje na GitHubu
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v10.5.0' }}
          target_commitish: ${{ github.sha }}
          name: ELDI EDU 10.5.0 — 1000 blokovskih projekata i AI asistent (Windows, build ${{ github.run_number }})
          body: |
            Preuzmite **ELDI-EDU-10.5.0-Portable-x64.exe** za direktno pokretanje ili **ELDI-EDU-10.5.0-Setup-x64.exe** za instalaciju.

            Nova sekcija **Zbirke i rješenja** povezuje obje priložene PDF knjige s pretragom zadataka, postupnim objašnjenjima, bilješkama učenika i Python/C++ editorom. Knjige se čitaju unutar aplikacije.

            **ELDI-EDU-10.5.0-Zbirke-i-rjesenja.zip** sadrži obje PDF knjige (203 i 464 stranice), 162 programerska zadatka s Python/C++ rješenjima i 53 odabrana matematička zadatka s postupkom. Svih 324 programerskih rješenja provjereno je izvršavanjem na dostupnim primjerima iz knjige. Matematička rješenja ne obuhvataju sve zadatke PDF knjige.

            Možete dodavati svoje sekcije i zadatke, uvoziti ELDI EDU JSON/ZIP pakete i izvoziti svoje zbirke u ZIP. Uvezeni kod izvršava se tek na vaš zahtjev u editoru.

            **Dark Edition** donosi tamnije pozadine, jasnije boje kategorija blokova i usklađen izgled radnog prostora, pozornice, konzole i prikaza koda. Tamna tema je početni izbor ovog izdanja; dugme teme omogućava prelazak na svijetli izgled bez promjene složenog programa ili rada učenika.

            500 matematičkih i 500 informatičkih tematskih cjelina i vještina s objašnjenjima, primjerima i praktičnim zadacima. Matematička zbirka omogućava 100.000 indeksiranih generisanja (500 vještina × 200 indeksa); indeksi ne znače 100.000 sadržajno različitih zadataka.

            Radni listovi i provjere do 50 zadataka, prilagodljivi pragovi ocjena, značke i diploma s rezultatom, imenima četiri autora i pečatom aplikacije. Diplomom se potvrđuje rezultat u aplikaciji.

            Blokovski studio ima 60 praktičnih izazova, 14 kategorija, konzolu, pozornicu i prikaz koda. Sadržaj obuhvata 5–9. razred; broj cjelina označava izdvojene vještine i nije tvrdnja o 500 zasebnih školskih nastavnih oblasti.

            Blokovi, kod, konzola i pozornica ostaju zajedno i na manjim Windows ekranima, a izbor izazova otvara se prema potrebi. Diplome zadržavaju svijetli papir za štampu i izvoz u PDF.

            **ELDI-EDU-10.5.0-1000-Blokovskih-projekata.zip** donosi 1000 riješenih projekata u blokovima za različite teme: programski obrasci, matematika, tekst, liste i crtanje. Projekti su grupisani po algoritamskim porodicama i varijantama ulaza. Biblioteka omogućava pretragu, filtre, postupnu pomoć, otvaranje rješenja u studiju, stvarno izvršavanje i uvoz ZIP/JSON paketa. Broj projekata ne znači 1000 zasebnih algoritama.

            Dugme **Pitaj AI asistenta** otvara stvarnu integraciju s OpenAI API ili lokalnim Ollama serverom. OpenAI zahtijeva vaš API ključ i internet; API usluga može se naplaćivati. ChatGPT pretplata ne uključuje API kredit. Ollama radi s vlastitim lokalnim serverom i preuzetim modelom. AI odgovor nije službena provjera tačnosti. Primjeri se lokalno provjeravaju u studiju.

            API ključ ne čuva se u profilu, ZIP paketu ili izvoru aplikacije. Pamćenje ključa koristi Windows šifriranu pohranu; moguće je koristiti ključ samo u trenutnoj sesiji. Svako slanje pitanja pokreće korisnik; kontekst se prethodno prikazuje. Osnovna nastava i izvršavanje blokova ostaju dostupni bez AI konfiguracije.

            Windows 10/11 x64. Python, GCC/G++ i Java JDK ugrađeni su u aplikaciju. Internet nije potreban za nastavu i izvršavanje školskih programa.

            Programi iz editora izvršavaju se lokalno s dozvolama vašeg Windows korisnika. Ovo izdanje nije digitalno potpisano.
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
