name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Preuzmi izvorni kod
        uses: actions/checkout@v7
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: GCC i G++ (MSYS2 UCRT64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          cache: false
      - name: Instaliraj zavisnosti
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ugradi službeni Scratch editor i offline biblioteku
        run: npm run scratch:bundle
      - name: Provjeri kod, sadržaj i integracije
        run: npm run check
      - name: Ugradi Python, GCC/G++ i JDK
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: npm run runtime:bundle
      - name: Ugradi ChatGPT prijavu bez API ključa
        run: npm run chatgpt:bundle
      - name: Provjeri 324 programa iz zbirke na Windowsu
        shell: pwsh
        run: |
          $bookPython = Join-Path $PWD 'runtimes/python/python.exe'
          $bookCpp = Join-Path $PWD 'runtimes/gcc/bin/g++.exe'
          $env:Path = (Split-Path $bookCpp) + ';' + $env:Path
          $env:ELDI_BOOK_CPP_FLAGS = node -e 'const path=require("node:path");console.log(JSON.stringify(require("./desktop/runner.cjs").bundledGccOptions(path.resolve("runtimes"),"cpp")))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bookPython scripts/verify-book-programming.py --python $bookPython --cpp $bookCpp --jobs 4 --output smoke-previews/programming-verification-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provjeri 55 programerskih izazova kroz 880 izvršavanja
        run: node scripts/verify-program-assessments.cjs --bundled --output smoke-previews/assessment-verification-windows.json
      - name: Provjeri sva četiri ugrađena jezika
        run: node scripts/check.cjs --bundled
      - name: Provjeri desktop tokove i Scratch izvršavanje
        run: npm run smoke
      - name: Sačuvaj razvojne prikaze za pregled
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ELDI-EDU-11.0.1-Development-QA
          path: smoke-previews/
          if-no-files-found: warn
          retention-days: 30
      - name: Izradi instalacijski i prenosivi EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          for ($buildAttempt = 1; $buildAttempt -le 3; $buildAttempt++) {
            & npm run build:win 2>&1 | Tee-Object -Variable buildOutput
            $buildExit = $LASTEXITCODE
            if ($buildExit -eq 0) { exit 0 }
            $transientDownload = ($buildOutput -join "`n") -match 'Response code 5\d\d|ECONNRESET|ETIMEDOUT|EAI_AGAIN|socket hang up'
            if (-not $transientDownload -or $buildAttempt -eq 3) { exit $buildExit }
            Write-Warning "Privremena greška preuzimanja alata; ponavljanje izrade ($buildAttempt/3)."
            Start-Sleep -Seconds 15
          }
      - name: Provjeri zapakovanu aplikaciju i pripremi ZIP pakete
        shell: pwsh
        run: |
          $application = Join-Path $PWD 'release/win-unpacked/ELDI EDU.exe'
          $process = Start-Process -FilePath $application -ArgumentList '--smoke-test' -WorkingDirectory $PWD -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Zapakovana aplikacija nije prošla provjeru pokretanja.' }
          $executables = Get-ChildItem release -Filter '*.exe'
          if ($executables.Count -ne 2) { throw 'Očekivana su dva EXE fajla.' }
          Get-ChildItem content/packs -Filter 'ELDI-EDU-11.0.1-*.zip' | Copy-Item -Destination release/
          $packs = Get-ChildItem release -Filter '*.zip'
          if ($packs.Count -lt 5) { throw 'Nedostaju ZIP zbirke, Blockly, programerski izazovi, Scratch primjeri ili izvori.' }
          Copy-Item 'docs/POKRETANJE.txt' 'release/POKRETANJE.txt'
          $portable = Get-ChildItem release -Filter '*Portable-x64.exe'
          if ($portable.Count -ne 1) { throw 'Nedostaje prenosiva aplikacija za kompletan paket.' }
          $fullPath = Join-Path $PWD 'release/ELDI-EDU-11.0.1-Kompletan-paket.zip'
          $fullFiles = @($portable.FullName) + @($packs.FullName) + @((Join-Path $PWD 'release/POKRETANJE.txt'))
          Compress-Archive -LiteralPath $fullFiles -DestinationPath $fullPath -CompressionLevel NoCompression -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $fullArchive = [System.IO.Compression.ZipFile]::OpenRead($fullPath)
          try { if ($fullArchive.Entries.Count -ne $fullFiles.Count) { throw 'Kompletan paket nema sve datoteke.' } } finally { $fullArchive.Dispose() }
          $packs = Get-ChildItem release -Filter '*.zip'
          @($executables) + @($packs) | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content release/SHA256SUMS.txt
      - name: Sačuvaj provjere izgleda i PDF diplomu
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ELDI-EDU-11.0.1-Visual-QA
          path: smoke-previews/
          if-no-files-found: warn
          retention-days: 30
      - name: Sačuvaj Windows EXE i ZIP pakete
        uses: actions/upload-artifact@v7
        with:
          name: ELDI-EDU-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Objavi izdanje na GitHubu
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v11.0.1' }}
          target_commitish: ${{ github.sha }}
          name: ELDI EDU 11.0.1 — ispravka slanja pitanja prijavljenim ChatGPT računom
          body: |
            **Windows 10/11 x64:** Portable EXE za direktno pokretanje ili Setup EXE za instalaciju.

            **Ispravka 11.0.1:** nakon uspješne prijave, izdanje 11.0.0 moglo je odbiti slanje pitanja zbog dva nepodržana parametra. Ispravljena je stabilna politika odobravanja i format read-only postavke za ugrađeni Codex 0.161.0. Stvarni protokol provjerava se na Windowsu bez prijave i bez inferencije. Prijava i izbor modela ostaju korisnikovi; API ključ nije potreban.

            **Kompletan-paket.zip** sadrži Portable EXE, svih pet ZIP zbirki/izvora i kratke upute. Raspakujte ga i pokrenite Portable EXE. Sve pojedinačne datoteke dostupne su i zasebno.

            **ChatGPT bez API ključa:** u asistentu kliknite **Prijavi se ChatGPT računom**. Ugrađeni službeni Codex app-server vodi prijavu kroz preglednik ili kod uređaja. Pretplata, limiti, model i nivo razmišljanja pripadaju prijavljenom računu. GPT‑6.1 Sol / Ultra koriste se kada ih servis ponudi i zahtjev uspješno potvrdi pristup; nema automatske zamjene drugim modelom. Svaki korisnik koristi vlastitu prijavu. API i Ollama ostaju dodatne opcije.

            **Digitalna matematička sveska:** osam porodica zadataka, provjera podržanih računskih koraka i linearnih jednačina, djelimični bodovi, sačuvani postupci, crteži i grafikoni. Konačan odgovor sam donosi 40/100; razrađeni tačni međukoraci do 60 dodatnih bodova. Dokaze i tekstualna obrazloženja pregleda nastavnik.

            **Nastavnički centar:** odjeljenja, spiskovi, zadaci od 1 do 50, dodjela lokalnim profilima, predaja, automatski rezultati, pregled postupka, komentari i zasebna nastavnička ocjena. Prenos JSON datotekama, CSV izvještaji i štampa.

            **Scratch studio:** službeni Scratch editor 15.2.0 s prilagođenim lokalnim putanjama. .sb3 uvoz/izvoz, događaji, likovi, kostimi, pozadine, zvukovi i šest originalnih ELDI projekata. Offline biblioteka je ugrađena. Pripadajući izvori i AGPL licenca dostupni su u Scratch-izvori ZIP-u. Blockly studio sa 1000 riješenih projekata ostaje zaseban.

            **Put učenja:** 91 cjelina povezuje svih 500 matematičkih i 500 informatičkih vještina. Objašnjenje, primjer, rad, provjera i preporuka. Početna mapa je urednički plan; nastavnik može dodati službene ishode, izvore, stranice i školsku godinu. Potpuna službena usklađenost nije potvrđena.

            **Programerski izazovi:** 55 različitih zadataka, po 11 za svaki razred, sa osam testova po zadatku. Podržani Python, C, C++ i Java. Python/C++ referentna rješenja provjerena kroz 880 izvršavanja. ZIP sadrži zadatke, rješenja, početne kodove i javne primjere.

            Novi tamni pregled, grupisana navigacija, pretraga sadržaja (Ctrl+K), veći tekst, nastavak posljednjeg rada, pet automatskih sigurnosnih kopija i provjera GitHub izdanja. Ocjene, značke i diplome s imenima autora i pečatom ostaju dostupni.

            Aplikacija ne prenosi tuđu ChatGPT pretplatu ni pristupne podatke. Živa prijava i AI odgovor provjeravaju se na računaru korisnika; razvojne provjere obuhvataju protokol, prekid, greške i stvarni ugrađeni servis bez prijave i inferencije. Osnovni sadržaj i školski programi rade bez interneta. Tekstualni programi koriste prava Windows korisnika; izdanje nije digitalno potpisano.

            Autori: **Dino Isanović · Elvir Čajić · Damir Bajrić · Jasmin Suljkanović**.
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
